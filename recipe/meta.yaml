{% set name = "sella" %}
{% set version = "2.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 7effc2a10f6d43c0bbdff11acb1fe36e16424cd9f01746660e87985662713384

build:
  # Sella 2.6.0 dropped its Cython extensions and is pure Python.
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=74.1,<82
    - setuptools-scm >=8
  run:
    - python >={{ python_min }}
    - numpy >=1.14.0
    - scipy >=1.1.0
    - ase >=3.26.0
    - jax >=0.4.20
    - jaxlib >=0.4.20

test:
  imports:
    - sella
    - sella.optimize
    - sella.internal
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/zadorlab/sella
  doc_url: https://github.com/zadorlab/sella/wiki
  dev_url: https://github.com/zadorlab/sella
  summary: Saddle point optimization for molecular systems
  description: |
    Sella is a utility for finding first-order saddle points (transition
    states) and minima on potential energy surfaces, built on ASE. It
    supports Cartesian and internal coordinates, constraints, IRC
    following, and cell optimization.
  license: LGPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - juditzador
    - awvwgk
